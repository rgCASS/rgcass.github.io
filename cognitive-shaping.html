<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>认知塑造 - rgCASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 复用现有项目 CSS 变量配色方案 */
        :root {
            --primary-blue: #0077ff;
            --light-blue: #00aaff;
            --text-primary: #212529;
            --text-secondary: #5a6470;
            --bg-light: #ffffff;
            --bg-off-white: #f8f9fa;
            --border-color: #dee2e6;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-off-white);
            color: var(--text-secondary);
        }

        /* 导航栏 */
        .light-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .nav-link {
            color: var(--text-primary);
            position: relative;
            padding-bottom: 4px;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-blue);
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }

        /* 标题样式 */
        .main-title {
            color: var(--text-primary);
        }

        .section-title {
            color: var(--primary-blue);
            font-weight: 500;
        }

        /* 卡片样式 */
        .card {
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px -2px rgb(0 0 0 / 0.05);
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px -5px rgba(0, 119, 255, 0.15);
            border-color: rgba(0, 119, 255, 0.3);
        }

        /* 点阵背景 */
        .tech-bg {
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 滚动淡入动画 */
        .fade-in-section {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="antialiased">

    <!-- 导航栏 -->
    <header id="header" class="light-nav fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold main-title">
                <a href="index.html">rgCASS</a>
            </div>
            <nav class="hidden md:flex space-x-8 text-lg">
                <a href="index.html" class="nav-link">网站首页</a>
                <a href="index.html#research" class="nav-link">研究方向</a>
                <a href="index.html#cooperation" class="nav-link">业务合作</a>
                <a href="index.html#team" class="nav-link">团队构成</a>
                <a href="index.html#recruitment" class="nav-link">联系我们</a>
            </nav>
            <!-- 移动端菜单按钮 -->
            <button id="mobile-menu-button" class="md:hidden text-gray-800 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
        </div>
        <!-- 移动端菜单 -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200">
            <a href="index.html" class="block py-3 px-6 text-lg nav-link hover:bg-gray-50">网站首页</a>
            <a href="index.html#research" class="block py-3 px-6 text-lg nav-link hover:bg-gray-50">研究方向</a>
            <a href="index.html#cooperation" class="block py-3 px-6 text-lg nav-link hover:bg-gray-50">业务合作</a>
            <a href="index.html#team" class="block py-3 px-6 text-lg nav-link hover:bg-gray-50">团队构成</a>
            <a href="index.html#recruitment" class="block py-3 px-6 text-lg nav-link hover:bg-gray-50">联系我们</a>
        </div>
    </header>

    <main>
        <!-- 第1屏：标题区 -->
        <section id="hero" class="min-h-screen flex items-center justify-center relative overflow-hidden bg-white pt-20">
            <div class="container mx-auto px-6 py-16 text-center">
                <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold main-title leading-tight mb-6">认知塑造</h1>
                <div class="max-w-3xl mx-auto text-lg md:text-xl text-gray-600 leading-relaxed">
                    <p>通过深度融合认知科学、人机交互与大模型技术,不断提升AI在复杂媒体环境中对用户的状态识别、认知推理与引导能力。</p>
                </div>
            </div>
        </section>

        <!-- 第2屏：研究内容 -->
        <section id="research-content" class="py-20 lg:py-32 fade-in-section tech-bg">
            <div class="container mx-auto px-6">
                <h2 class="text-3xl md:text-4xl font-bold text-center mb-4 main-title">研究内容</h2>
                <p class="text-center text-lg section-title mb-16">面向真实交互场景,建立对用户情感和认知深度理解的AI模型,设计信息传达、人机交互策略,打造理解、共情并提供认知支持的智能伙伴。</p>
            </div>
        </section>

        <!-- 第3屏：应用场景 -->
        <section id="applications" class="py-20 lg:py-32 bg-white fade-in-section">
            <div class="container mx-auto px-6">
                <h2 class="text-3xl md:text-4xl font-bold text-center mb-4 main-title">应用场景</h2>
                <p class="text-center text-lg section-title mb-16">深度嵌入信息传达、情感支持与认知影响的各类人机共生场景。</p>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white py-8 border-t border-gray-200">
        <div class="container mx-auto px-6 text-center text-gray-600">
            <p>&copy; 2025-2026 智能体与社会仿真实验室. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // 移动端菜单开合
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // 点击移动端菜单链接后自动收起
        document.querySelectorAll('#mobile-menu a').forEach(anchor => {
            anchor.addEventListener('click', function () {
                mobileMenu.classList.add('hidden');
            });
        });

        // 滚动淡入动画
        const sections = document.querySelectorAll('.fade-in-section');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, {
            rootMargin: '0px',
            threshold: 0.1
        });

        sections.forEach(section => {
            observer.observe(section);
        });
    </script>
</body>
</html>
